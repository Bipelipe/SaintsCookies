name: Publish Saints Cookies

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published version
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Check out the review version
        uses: actions/checkout@v4
        with:
          ref: preview
          path: review
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            review/package-lock.json
      - name: Build the published site from main
        working-directory: production
        run: |
          npm ci
          npm test
          npm run build -- --base=/SaintsCookies/
      - name: Build the preview from its branch
        working-directory: review
        run: |
          npm ci
          npm test
          npm run build -- --base=/SaintsCookies/preview/
      - name: Assemble both sites for GitHub Pages
        run: |
          mkdir -p site/preview
          cp -a production/dist/. site/
          cp -a review/dist/. site/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
